// Skaar default configuration. Executed by the engine at startup before the
// user's skaarconfig.cfg. Original file (GPLv2-or-later, see COPYING.txt).

unbindall

// movement
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind SPACE "+moveup"
bind CTRL "+movedown"
bind SHIFT "+speed"

// actions
bind MOUSE1 "+attack"
bind MOUSE2 "+zoom"
bind r "sk_restart"
bind i "sk_insights"
bind TAB "+scores"
bind ESCAPE "togglemenu"
bind F12 "screenshotJPEG"

// arena weapons (Q3 slot numbers: 3 shotgun, 5 rocket, 6 lightning, 7 rail)
bind 3 "weapon 3"
bind 5 "weapon 5"
bind 6 "weapon 6"
bind 7 "weapon 7"
bind MWHEELUP "weapprev"
bind MWHEELDOWN "weapnext"

// input: raw mouse, no acceleration (see docs/sensitivity.md once written)
seta in_mouse "1"
seta cl_mouseAccel "0"
seta m_filter "0"
seta m_pitch "0.022"
seta m_yaw "0.022"
seta sensitivity "2"

// no pk3 files yet: pure server checks would only warn
seta sv_pure "0"
// no bot data until P6; botlib otherwise errors every frame
seta bot_enable "0"

// network/simulation: the local server ticks and snapshots at 125 Hz (matches pmove_msec 8)
seta sv_fps "125"
seta snaps "125"
seta rate "100000"
seta cl_maxpackets "125"

// full-resolution textures
seta r_picmip "0"

// the GL2 renderer's HDR auto-exposure pulls the light range to mid-grey;
// keep the image as authored
seta r_autoExposure "0"
seta r_toneMap "0"

// reticle: a small pastel-yellow "+" (game/shared/reticle.h)
seta cg_crosshairStyle "0"
seta cg_crosshairSize "4"
seta cg_crosshairGap "0"
seta cg_crosshairThickness "2"
seta cg_crosshairColor "f7e08a"
seta cg_crosshairOutline "1"

// display and pacing
seta com_maxfps "0"
seta r_swapInterval "0"
seta cl_renderer "opengl2"
// a centered, resizable 854x480 window at every launch; Cmd+Ctrl+F (or the green
// button, Cmd+Enter, Alt+Enter) toggles fullscreen without a video restart
seta r_mode "-1"
seta r_customwidth "854"
seta r_customheight "480"
seta r_allowResize "1"
seta r_centerWindow "1"
seta con_scale "1.5"
